<!doctype html>
<html lang="en">
<head>
    <!-- EmailJS SDK (latest version) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
      (function(){
        emailjs.init('cLhDB8nWdSIMPtG-l'); // Your EmailJS Public Key
      })();
    </script>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book Travis Kim — Seattle Magician</title>
  <meta name="description" content="Contact Travis Kim to book a close-up magician in Seattle. Email travis@closeuplab.com for availability and pricing.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container booking-page">
    <a href="index.html" style="color:#fff;text-decoration:underline;margin-bottom:0.1rem;display:inline-block;">Return to Main Page</a>
    <br style="line-height:0.2;"><br style="line-height:0.2;">
    <h1 style="margin-top: 0.1em;">Book Magician Travis Kim</h1>
    <p>Thank you for your interest! Please fill the form below to create an email booking request, or click the direct email button to open your mail client. Best wishes, Travis</p>

    <form id="bookingForm">
      <label id="nameLabel">Name <span class="required-asterisk">*</span>
        <input type="text" id="userName" name="user_name" placeholder="Your name" required>
      </label>
      <label id="emailLabel">Your email <span class="required-asterisk">*</span>
        <input type="text" id="userEmail" name="user_email" placeholder="your@email.com" required>
      </label>
      <label id="phoneLabel">Phone number
        <input type="text" id="userPhone" name="user_phone" placeholder="Leave your number if you'd like a call to discuss your event (optional)">
      </label>
      <label id="eventDateLabel">Event Date and Time <span class="required-asterisk">*</span>
        <input type="text" id="eventDate" name="event_date" placeholder="July 23, 2026 at 7pm, or TBD" required>
      </label>
      <label>Performance type <span class="required-asterisk">*</span>
        <select id="performance" name="performance" required>
          <option value="Strolling Magic">Strolling Magic</option>
          <option value="Sit-down Parlour Show">Sit-down Parlour Show</option>
          <option value="Something Else">Something Else</option>
          <option value="Not Sure">Not Sure</option>
        </select>
      </label>
      <label>Message <span class="required-asterisk">*</span>
        <textarea id="message" name="message" rows="4" placeholder="Tell us a about the event you're planning!" required></textarea>
      </label>
      <style>
        .form-actions {
          display: flex;
          gap: 1rem;
          justify-content: space-between;
        }
        .required-asterisk {
          color: red;
        }
        .missing-field .required-asterisk {
          color: #fff;
          background: red;
          border-radius: 50%;
          padding: 0 6px;
        }
        a[href^="mailto:"] {
          color: #fff !important;
        }
      </style>

      

      <div class="form-actions">
        <button class="btn primary" type="submit">Submit Form</button>
        <a class="btn ghost" href="index.html" style="margin-left:1rem;">Return to Main Page</a>
      </div>
    </form>

    
  </main>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      emailjs.sendForm('service_l894qhg', 'template_y1o9v3q', this)
        .then(function() {
          alert('Booking request sent! Thank you.');
          window.location.href = "booking-confirmation.html";
        }, function(error) {
          alert('There was an error sending your booking request. Please try again or email travis@closeuplab.com.');
        });
    });
  </script>
</body>
</html>
