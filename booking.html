<!doctype html>
<html lang="en">
<head>
    <!-- EmailJS SDK (latest version) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
      (function(){
        emailjs.init('cLhDB8nWdSIMPtG-l'); // Your EmailJS Public Key
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17854468227"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17854468227');
    </script>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book Travis Kim — Seattle Magician</title>
  <meta name="description" content="Contact Travis Kim to book a close-up magician in Seattle. Email travis@tkards.com for availability and pricing.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container booking-page">
    <a href="index.html" class="booking-return-link">← RETURN TO MAIN PAGE</a>

    <section class="booking-layout" aria-labelledby="booking-title">
      <figure class="booking-image-wrap">
        <img class="booking-image" src="assets/New Magic Photos/seattle pike place magician travis kim 2.JPG" alt="Travis Kim performing at Pike Place with cascading cards and guests reacting behind him.">
      </figure>

      <div class="booking-intro">
        <p class="booking-eyebrow">BOOKING INQUIRY</p>
        <h1 id="booking-title" class="booking-title">Tell Me About Your Event.</h1>
        <p class="booking-description">Share a few details below and I&apos;ll be in touch to discuss availability and create an experience tailored to your celebration.</p>
      </div>

      <form id="bookingForm" class="booking-form">
        <label id="nameLabel">Name <span class="required-asterisk">*</span>
          <input type="text" id="userName" name="user_name" placeholder="Your name" required>
        </label>
        <label id="emailLabel">Your email <span class="required-asterisk">*</span>
          <input type="text" id="userEmail" name="user_email" placeholder="your@email.com" required>
        </label>
        <label id="phoneLabel">Phone number
          <input type="text" id="userPhone" name="user_phone" placeholder="Leave your number if you'd like a call to discuss your event (optional)">
        </label>
        <label id="eventDateLabel">Event Date and Time <span class="required-asterisk">*</span>
          <input type="text" id="eventDate" name="event_date" placeholder="July 23, 2026 at 7pm, or TBD" required>
        </label>
        <label>Performance type <span class="required-asterisk">*</span>
          <select id="performance" name="performance" required>
            <option value="Strolling Magic">Strolling Magic</option>
            <option value="Sit-down Parlour Show">Sit-down Parlour Show</option>
            <option value="Something Else">Something Else</option>
            <option value="Not Sure">Not Sure</option>
          </select>
        </label>
        <label>Message <span class="required-asterisk">*</span>
          <textarea id="message" name="message" rows="4" placeholder="Tell us a about the event you're planning! Example: Private party in Seattle, about 30 guests, cocktail style from 7–9pm." required></textarea>
        </label>

        <div class="form-actions">
          <button class="hero-copy-cta booking-submit" type="submit">Send Inquiry</button>
        </div>
        <p class="booking-note">Most events feature 1&ndash;3 hours of performance, thoughtfully tailored to your guest count and schedule.</p>
      </form>
    </section>

    
  </main>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      emailjs.sendForm('service_l894qhg', 'template_y1o9v3q', this)
        .then(function() {
          alert('Booking request sent! Thank you.');
          window.location.href = "booking-confirmation.html";
        }, function(error) {
          alert('There was an error sending your booking request. Please try again or email travis@tkards.com.');
        });
    });
  </script>
</body>
</html>
