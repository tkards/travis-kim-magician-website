<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking Submitted</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0B0D10;
      color: #f6f4f1;
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
    }

    .confirmation-box {
      width: min(680px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(17, 20, 25, 0.86);
      padding: clamp(1.6rem, 4vw, 3rem);
      text-align: center;
    }

    .confirmation-box h1 {
      margin: 0 0 0.8rem;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: #f6f4f1;
    }

    .confirmation-box p {
      margin: 0 auto 1.8rem;
      max-width: 42ch;
      font-size: clamp(0.95rem, 1.3vw, 1.06rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }

    .btn {
      display: inline-block;
      padding: 0.88rem 1.7rem;
      border: 1.5px solid rgba(214, 183, 125, 0.86);
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.14);
      color: #f2dfb3;
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background-color .2s ease, color .2s ease, border-color .2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      background: #d2b172;
      border-color: #d2b172;
      color: #0B0D10;
      outline: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
  <script>
    setTimeout(function() {
      window.location.href = "index.html";
    }, 10000);
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17854468227"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-17854468227');
  </script>
</head>
<body>
  <div class="confirmation-box">
    <h1>Thank You!</h1>
    <p>Your booking form has been submitted and we will get back to you within 1-3 business days (usually much sooner than that). Thank you!</p>
    <a class="btn" href="index.html">Return to Main Page</a>
  </div>
</body>
</html>
